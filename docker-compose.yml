version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: anime_bot_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: anime_caption_bot
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - anime_bot_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Anime Caption Bot
  anime_bot:
    build: .
    container_name: anime_caption_bot
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
    networks:
      - anime_bot_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: MongoDB Express (Web UI for MongoDB)
  mongo_express:
    image: mongo-express:latest
    container_name: anime_bot_mongo_express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - anime_bot_network
    profiles:
      - debug

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  anime_bot_network:
    driver: bridge
